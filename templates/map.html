<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City World Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #172033; }
    #map { height: 100vh; width: 100%; }
    .topbar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 10px; align-items: flex-start; pointer-events: none;
    }
    .search-box, .info-box {
      pointer-events: auto; background: white; border: 1px solid #d8dee8;
      border-radius: 8px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }
    .search-box {
      width: min(520px, 100%); position: relative; display: flex; gap: 8px; padding: 10px;
    }
    input {
      width: 100%; padding: 11px 12px; border: 1px solid #cfd6e2;
      border-radius: 6px; font-size: 15px;
    }
    button {
      border: 0; border-radius: 6px; padding: 11px 13px; background: #1f2937;
      color: white; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    button.secondary { background: #2563eb; }
    .suggestions {
      position: absolute; left: 10px; right: 10px; top: 58px; max-height: 280px;
      overflow-y: auto; background: white; border: 1px solid #d8dee8;
      border-radius: 8px; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }
    .suggestion {
      display: block; width: 100%; padding: 11px 12px; border: 0;
      border-bottom: 1px solid #edf0f4; background: white; color: #172033;
      text-align: left; font-weight: 400; cursor: pointer;
    }
    .suggestion:hover, .suggestion.active { background: #eff6ff; }
    .suggestion strong, .suggestion small { display: block; }
    .suggestion small { margin-top: 3px; color: #637083; }
    .info-box { width: 280px; padding: 12px; line-height: 1.45; }
    .info-box h2 { margin: 0 0 8px; font-size: 17px; }
    .info-box p { margin: 6px 0; font-size: 14px; }
    .hidden { display: none; }
    @media (max-width: 760px) {
      .topbar { flex-direction: column; }
      .info-box { width: min(520px, 100%); }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="search-box">
      <input id="searchInput" type="text" autocomplete="off" placeholder="Search places like Google Earth">
      <button onclick="searchFirstResult()">Search</button>
      <button class="secondary" onclick="startGps()">GPS</button>
      <div id="suggestions" class="suggestions hidden"></div>
    </div>

    <div class="info-box">
      <h2>Live Details</h2>
      <p><b>Place:</b> <span id="placeName">None selected</span></p>
      <p><b>Latitude:</b> <span id="latText">--</span></p>
      <p><b>Longitude:</b> <span id="lngText">--</span></p>
      <p><b>Accuracy:</b> <span id="accuracyText">--</span></p>
      <p><b>Temperature:</b> <span id="tempText">--</span></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Create the real world map.
    const map = L.map("map").setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "OpenStreetMap contributors"
    }).addTo(map);

    let marker = null, accuracyCircle = null, suggestions = [];
    let selectedIndex = -1, suggestionTimer = null, gpsWatchId = null;

    const searchInput = document.getElementById("searchInput");
    const suggestionsBox = document.getElementById("suggestions");

    // Load place suggestions while typing.
    searchInput.addEventListener("input", () => {
      clearTimeout(suggestionTimer);
      suggestionTimer = setTimeout(loadSuggestions, 300);
    });

    // Let the keyboard control the suggestion list.
    searchInput.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        selectedIndex = Math.min(selectedIndex + 1, suggestions.length - 1);
        showSuggestions();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        selectedIndex = Math.max(selectedIndex - 1, 0);
        showSuggestions();
      } else if (event.key === "Enter") {
        event.preventDefault();
        chooseSuggestion(selectedIndex >= 0 ? selectedIndex : 0);
      } else if (event.key === "Escape") {
        hideSuggestions();
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".search-box")) hideSuggestions();
    });

    function loadSuggestions() {
      const query = searchInput.value.trim();
      if (query.length < 2) return hideSuggestions();

      fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&q=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
          suggestions = data;
          selectedIndex = -1;
          showSuggestions();
        })
        .catch(() => {
          suggestionsBox.innerHTML = `<div class="suggestion">Search unavailable</div>`;
          suggestionsBox.classList.remove("hidden");
        });
    }

    function showSuggestions() {
      if (suggestions.length === 0) {
        suggestionsBox.innerHTML = `<div class="suggestion">No places found</div>`;
        return suggestionsBox.classList.remove("hidden");
      }

      suggestionsBox.innerHTML = suggestions.map((place, index) => {
        const active = index === selectedIndex ? " active" : "";
        const title = place.name || place.display_name.split(",")[0];
        return `
          <button class="suggestion${active}" onclick="chooseSuggestion(${index})">
            <strong>${escapeHtml(title)}</strong>
            <small>${escapeHtml(place.display_name)}</small>
          </button>`;
      }).join("");

      suggestionsBox.classList.remove("hidden");
    }

    function hideSuggestions() {
      suggestionsBox.classList.add("hidden");
      selectedIndex = -1;
    }

    function searchFirstResult() {
      suggestions.length ? chooseSuggestion(0) : loadSuggestions();
    }

    function chooseSuggestion(index) {
      const place = suggestions[index];
      if (!place) return;

      const lat = Number(place.lat);
      const lng = Number(place.lon);
      const title = place.name || place.display_name.split(",")[0];
      searchInput.value = title;
      hideSuggestions();
      showLocation(lat, lng, title, null);
    }

    // Show marker, update details, read temperature.
    function showLocation(lat, lng, title, accuracy) {
      const point = [lat, lng];
      marker ? marker.setLatLng(point) : marker = L.marker(point).addTo(map);
      marker.bindPopup(title).openPopup();
      map.flyTo(point, 14);

      if (accuracyCircle) map.removeLayer(accuracyCircle);
      if (accuracy) {
        accuracyCircle = L.circle(point, {
          radius: accuracy,
          color: "#2563eb",
          fillOpacity: 0.08
        }).addTo(map);
      }

      document.getElementById("placeName").textContent = title;
      document.getElementById("latText").textContent = lat.toFixed(6);
      document.getElementById("lngText").textContent = lng.toFixed(6);
      document.getElementById("accuracyText").textContent = accuracy ? `${Math.round(accuracy)} m` : "--";
      loadTemperature(lat, lng);
    }

    // Open-Meteo gives temperature without an API key.
    function loadTemperature(lat, lng) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m`;
      fetch(url)
        .then(response => response.json())
        .then(data => document.getElementById("tempText").textContent = `${data.current.temperature_2m.toFixed(1)} C`)
        .catch(() => document.getElementById("tempText").textContent = "Unavailable");
    }

    // Browser GPS requires location permission.
    function startGps() {
      if (!navigator.geolocation) return alert("GPS is not supported in this browser.");
      if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);

      gpsWatchId = navigator.geolocation.watchPosition(
        position => showLocation(
          position.coords.latitude,
          position.coords.longitude,
          "Live GPS Location",
          position.coords.accuracy
        ),
        () => alert("Please allow location access to use GPS."),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Clicking anywhere on the map drops a marker.
    map.on("click", event => {
      showLocation(event.latlng.lat, event.latlng.lng, "Selected Map Point", null);
    });

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
