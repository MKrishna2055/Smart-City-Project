<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Dashboard</title>

    <!-- LEAFLET CSS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#0f172a;
            color:white;
        }

        .navbar{
            background:#111827;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            color:#38bdf8;
        }

        .container{
            width:90%;
            margin:auto;
            padding:20px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
        }

        h2{
            color:#38bdf8;
        }

        /* MAP STYLE */
        #map{
            width:100%;
            height:650px;
            border-radius:20px;
            margin-top:20px;
            overflow:hidden;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        .info-box{
            margin-top:20px;
            padding:15px;
            background:#1e293b;
            border-radius:15px;
        }

        .coords{
            color:#38bdf8;
            font-weight:bold;
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        Smart City Dashboard
    </div>

    <div class="container">

        <!-- EXISTING CONTENT -->
        <div class="card">
            <h2>Welcome</h2>
            <p>
                Smart City Monitoring System with Real-Time Interactive Map.
            </p>
        </div>

        <!-- MAP SECTION -->
        <div class="card">

            <h2>World Interactive Map</h2>

            <div class="info-box">
                Latitude:
                <span id="lat" class="coords">--</span>

                <br><br>

                Longitude:
                <span id="lng" class="coords">--</span>
            </div>

            <!-- MAP -->
            <div id="map"></div>

        </div>

    </div>

    <!-- LEAFLET JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <script>

        // CREATE MAP
        const map = L.map('map').setView([20, 0], 2);

        // ADD OPENSTREETMAP TILES
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let marker;

        // CLICK EVENT
        map.on('click', function(e){

            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // DISPLAY COORDINATES
            document.getElementById("lat").innerText = lat.toFixed(6);
            document.getElementById("lng").innerText = lng.toFixed(6);

            // REMOVE OLD MARKER
            if(marker){
                map.removeLayer(marker);
            }

            // ADD NEW MARKER
            marker = L.marker([lat, lng], {
                draggable:true
            }).addTo(map);

            marker.bindPopup(`
                <b>Selected Location</b><br>
                Latitude: ${lat.toFixed(5)}<br>
                Longitude: ${lng.toFixed(5)}
            `).openPopup();

            // SEND TO FLASK BACKEND
            fetch('/save_location', {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body: JSON.stringify({
                    latitude:lat,
                    longitude:lng,
                    title:'Selected Location'
                })

            });

        });

    </script>

</body>
</html>
